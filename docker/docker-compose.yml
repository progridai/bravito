version: '3.8'

services:
  postgres:
    image: postgres:17
    container_name: bravito_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_KEYCLOAK_DB: ${POSTGRES_KEYCLOAK_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-user-db.sh:/docker-entrypoint-initdb.d/init-user-db.sh
    networks:
      - bravito_net

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: bravito_keycloak
    command: start-dev --import-realm
    volumes:
      - ./keycloak/bravito-realm.json:/opt/keycloak/data/import/bravito-realm.json
      - ./keycloak/themes:/opt/keycloak/themes
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_KEYCLOAK_DB}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "${KEYCLOAK_PORT}:8080"
    depends_on:
      - postgres
    networks:
      - bravito_net

volumes:
  postgres_data:

networks:
  bravito_net:
    driver: bridge
